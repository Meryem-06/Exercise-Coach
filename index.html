<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitPulse - Egzersiz ve Antrenman Koçu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#6366f1'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">

  <!-- Navbar -->
  <header class="border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-dumbbell text-brand text-2xl"></i>
        <span class="font-bold text-lg tracking-tight">FitPulse</span>
      </div>
      <div class="flex items-center gap-4">
        <nav class="flex gap-2">
          <button onclick="switchTab('today')" id="tab-today" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-brand text-white">Bugün</button>
          <button onclick="switchTab('program')" id="tab-program" class="px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-800">Program Yap</button>
          <button onclick="switchTab('library')" id="tab-library" class="px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-800">Kütüphane</button>
        </nav>
        <button onclick="toggleTheme()" class="p-2 rounded-lg border border-slate-200 dark:border-slate-800 hover:bg-slate-200 dark:hover:bg-slate-800">
          <i id="theme-icon" class="fa-solid fa-sun text-amber-400"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 md:p-6">
    
    <!-- SEKME 1: BUGÜNÜN ANTRENMANI -->
    <section id="view-today" class="space-y-6">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h1 class="text-2xl font-bold">Bugünün Antrenmanı</h1>
          <p id="current-day-label" class="text-slate-500 dark:text-slate-400 text-sm capitalize"></p>
        </div>
        <div class="flex items-center gap-2 bg-white dark:bg-slate-800 p-1.5 rounded-xl border border-slate-200 dark:border-slate-700">
          <button onclick="setPreviewDay(1)" class="day-btn px-2.5 py-1 rounded text-xs">Pzt</button>
          <button onclick="setPreviewDay(2)" class="day-btn px-2.5 py-1 rounded text-xs">Sal</button>
          <button onclick="setPreviewDay(3)" class="day-btn px-2.5 py-1 rounded text-xs">Çar</button>
          <button onclick="setPreviewDay(4)" class="day-btn px-2.5 py-1 rounded text-xs">Per</button>
          <button onclick="setPreviewDay(5)" class="day-btn px-2.5 py-1 rounded text-xs">Cum</button>
          <button onclick="setPreviewDay(6)" class="day-btn px-2.5 py-1 rounded text-xs">Cmt</button>
          <button onclick="setPreviewDay(0)" class="day-btn px-2.5 py-1 rounded text-xs">Paz</button>
        </div>
      </div>

      <div id="today-exercises" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- JS ile dolacak -->
      </div>
    </section>

    <!-- SEKME 2: PROGRAM OLUŞTURUCU -->
    <section id="view-program" class="space-y-6 hidden">
      <div>
        <h1 class="text-2xl font-bold">Haftalık Rutinini Planla</h1>
        <p class="text-slate-500 dark:text-slate-400 text-sm">Her gün için kütüphaneden hareket seç veya tüm günleri tek tıkla eşitle.</p>
      </div>

      <div class="flex flex-wrap gap-2 border-b border-slate-200 dark:border-slate-800 pb-3">
        <button onclick="selectRoutineDay('all')" class="routine-tab px-3 py-1.5 rounded-lg text-sm font-semibold bg-brand text-white">Her Gün Aynı</button>
        <button onclick="selectRoutineDay('1')" class="routine-tab px-3 py-1.5 rounded-lg text-sm bg-slate-200 dark:bg-slate-800">Pazartesi</button>
        <button onclick="selectRoutineDay('2')" class="routine-tab px-3 py-1.5 rounded-lg text-sm bg-slate-200 dark:bg-slate-800">Salı</button>
        <button onclick="selectRoutineDay('3')" class="routine-tab px-3 py-1.5 rounded-lg text-sm bg-slate-200 dark:bg-slate-800">Çarşamba</button>
        <button onclick="selectRoutineDay('4')" class="routine-tab px-3 py-1.5 rounded-lg text-sm bg-slate-200 dark:bg-slate-800">Perşembe</button>
        <button onclick="selectRoutineDay('5')" class="routine-tab px-3 py-1.5 rounded-lg text-sm bg-slate-200 dark:bg-slate-800">Cuma</button>
        <button onclick="selectRoutineDay('6')" class="routine-tab px-3 py-1.5 rounded-lg text-sm bg-slate-200 dark:bg-slate-800">Cumartesi</button>
        <button onclick="selectRoutineDay('0')" class="routine-tab px-3 py-1.5 rounded-lg text-sm bg-slate-200 dark:bg-slate-800">Pazar</button>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 space-y-4">
          <h2 class="font-semibold text-lg flex items-center justify-between">
            <span>Kütüphaneden Egzersiz Ekle</span>
            <span id="target-day-name" class="text-xs text-brand font-medium">Hedef: Her Gün</span>
          </h2>
          <div id="builder-library-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[600px] overflow-y-auto pr-2">
            <!-- JS ile hareketler listelenecek -->
          </div>
        </div>

        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 h-fit space-y-4">
          <h2 class="font-semibold text-lg">Seçili Egzersizler</h2>
          <div id="selected-routine-list" class="space-y-2 min-h-[150px]">
            <!-- Seçilenler buraya gelecek -->
          </div>
        </div>
      </div>
    </section>

    <!-- SEKME 3: EGZERSİZ KÜTÜPHANESİ & GİFLER -->
    <section id="view-library" class="space-y-6 hidden">
      <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4">
        <div>
          <h1 class="text-2xl font-bold">Egzersiz Kütüphanesi</h1>
          <p class="text-slate-500 dark:text-slate-400 text-sm">Form rehberleri ve animasyonlar.</p>
        </div>
        <div class="flex flex-wrap gap-2" id="filter-buttons">
          <button onclick="filterCategory('hepsi')" class="filter-btn active px-3 py-1 rounded-full text-xs font-semibold bg-brand text-white">Tümü</button>
          <button onclick="filterCategory('sırt')" class="filter-btn px-3 py-1 rounded-full text-xs bg-slate-200 dark:bg-slate-800">Sırt</button>
          <button onclick="filterCategory('kol')" class="filter-btn px-3 py-1 rounded-full text-xs bg-slate-200 dark:bg-slate-800">Kol</button>
          <button onclick="filterCategory('bacak')" class="filter-btn px-3 py-1 rounded-full text-xs bg-slate-200 dark:bg-slate-800">Bacak</button>
          <button onclick="filterCategory('kalça')" class="filter-btn px-3 py-1 rounded-full text-xs bg-slate-200 dark:bg-slate-800">Kalça</button>
        </div>
      </div>

      <div id="full-library-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- JS ile dolacak -->
      </div>
    </section>

  </main>

  <script>
    // --- VERİ HAVUZU ---
    const EXERCISES = [
      { id: 'ex1', name: 'Lat Pulldown', category: 'sırt', target: 'Kanat & Üst Sırt', gif: 'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=500&auto=format&fit=crop&q=60' },
      { id: 'ex2', name: 'Barbell Row', category: 'sırt', target: 'Orta Sırt', gif: 'https://images.unsplash.com/photo-1605296867304-46d5465a13f1?w=500&auto=format&fit=crop&q=60' },
      { id: 'ex3', name: 'Bicep Dumbbell Curl', category: 'kol', target: 'Biceps', gif: 'https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=500&auto=format&fit=crop&q=60' },
      { id: 'ex4', name: 'Triceps Rope Pushdown', category: 'kol', target: 'Triceps', gif: 'https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=500&auto=format&fit=crop&q=60' },
      { id: 'ex5', name: 'Wrist Curl (Ön Kol)', category: 'kol', target: 'Ön Kol (Forearms)', gif: 'https://images.unsplash.com/photo-1590487988256-9ed24133863e?w=500&auto=format&fit=crop&q=60' },
      { id: 'ex6', name: 'Goblet Squat', category: 'bacak', target: 'Quadriceps', gif: 'https://images.unsplash.com/photo-1574680096145-d05b474e2155?w=500&auto=format&fit=crop&q=60' },
      { id: 'ex7', name: 'Romanian Deadlift (RDL)', category: 'bacak', target: 'Hamstring & Glute', gif: 'https://images.unsplash.com/photo-1517838277536-f5f99be501cd?w=500&auto=format&fit=crop&q=60' },
      { id: 'ex8', name: 'Barbell Hip Thrust', category: 'kalça', target: 'Gluteus Maximus', gif: 'https://images.unsplash.com/photo-1566241142559-40e1dab266c6?w=500&auto=format&fit=crop&q=60' },
      { id: 'ex9', name: 'Glute Cable Kickback', category: 'kalça', target: 'Gluteus Medius', gif: 'https://images.unsplash.com/photo-1538805060514-97d9cc17730c?w=500&auto=format&fit=crop&q=60' },
    ];

    const DAYS = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];

    // LocalStorage Yönetimi
    let routines = JSON.parse(localStorage.getItem('fit_routines')) || {
      'all': ['ex1', 'ex3', 'ex6'],
      '1': [], '2': [], '3': [], '4': [], '5': [], '6': [], '0': []
    };
    let activeDay = new Date().getDay();
    let currentBuilderDay = 'all';

    function saveRoutines() {
      localStorage.setItem('fit_routines', JSON.stringify(routines));
    }

    // --- TEMA YÖNETİMİ ---
    function initTheme() {
      if (localStorage.theme === 'light') {
        document.documentElement.classList.remove('dark');
        document.getElementById('theme-icon').className = 'fa-solid fa-moon text-slate-600';
      } else {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon').className = 'fa-solid fa-sun text-amber-400';
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.theme = isDark ? 'dark' : 'light';
      document.getElementById('theme-icon').className = isDark 
        ? 'fa-solid fa-sun text-amber-400' 
        : 'fa-solid fa-moon text-slate-600';
    }

    // --- SEKME GEÇİŞLERİ ---
    function switchTab(tab) {
      ['today', 'program', 'library'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = 'px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-800';
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'px-3 py-1.5 rounded-lg text-sm font-medium bg-brand text-white';

      if(tab === 'today') renderToday();
      if(tab === 'program') renderBuilder();
      if(tab === 'library') renderLibrary('hepsi');
    }

    // --- BUGÜNÜN LİSTESİ ---
    function setPreviewDay(day) {
      activeDay = day;
      renderToday();
    }

    function renderToday() {
      const label = document.getElementById('current-day-label');
      label.textContent = `${DAYS[activeDay]} için hedeflenen program`;

      // Gün butonlarını renklendir
      document.querySelectorAll('.day-btn').forEach((btn, idx) => {
        const d = [1,2,3,4,5,6,0][idx];
        if (d === activeDay) {
          btn.className = 'day-btn px-2.5 py-1 rounded text-xs bg-brand text-white font-bold';
        } else {
          btn.className = 'day-btn px-2.5 py-1 rounded text-xs hover:bg-slate-200 dark:hover:bg-slate-700';
        }
      });

      // Eğer o güne özel egzersiz yoksa 'all' (varsayılan) listesini al
      const list = (routines[activeDay] && routines[activeDay].length > 0) ? routines[activeDay] : routines['all'];
      const container = document.getElementById('today-exercises');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = `<div class="col-span-2 text-center py-12 text-slate-400">Bu gün için planlanan hareket yok. Program Yap sekmesinden ekleyebilirsin.</div>`;
        return;
      }

      list.forEach(exId => {
        const ex = EXERCISES.find(e => e.id === exId);
        if (!ex) return;
        const card = document.createElement('div');
        card.className = 'bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 flex gap-4 items-center';
        card.innerHTML = `
          <img src="${ex.gif}" alt="${ex.name}" class="w-20 h-20 rounded-xl object-cover border border-slate-100 dark:border-slate-700" />
          <div class="flex-1">
            <span class="text-xs uppercase font-semibold text-brand tracking-wider">${ex.category}</span>
            <h3 class="font-bold text-base">${ex.name}</h3>
            <p class="text-xs text-slate-400 mt-1">${ex.target}</p>
          </div>
          <button onclick="this.classList.toggle('bg-emerald-500'); this.classList.toggle('text-white');" class="w-10 h-10 rounded-full border border-slate-300 dark:border-slate-600 flex items-center justify-center transition">
            <i class="fa-solid fa-check"></i>
          </button>
        `;
        container.appendChild(card);
      });
    }

    // --- PROGRAM OLUŞTURUCU ---
    function selectRoutineDay(day) {
      currentBuilderDay = day;
      document.querySelectorAll('.routine-tab').forEach(btn => {
        btn.className = 'routine-tab px-3 py-1.5 rounded-lg text-sm bg-slate-200 dark:bg-slate-800';
      });
      event.target.className = 'routine-tab px-3 py-1.5 rounded-lg text-sm font-semibold bg-brand text-white';
      
      const dayName = day === 'all' ? 'Her Gün (Genel Şablon)' : DAYS[day];
      document.getElementById('target-day-name').textContent = `Hedef: ${dayName}`;
      renderBuilder();
    }

    function renderBuilder() {
      // Egzersiz Ekleme Havuzu
      const libContainer = document.getElementById('builder-library-list');
      libContainer.innerHTML = '';
      EXERCISES.forEach(ex => {
        const isAdded = routines[currentBuilderDay].includes(ex.id);
        const card = document.createElement('div');
        card.className = 'p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 flex items-center justify-between';
        card.innerHTML = `
          <div>
            <p class="text-xs text-brand font-medium uppercase">${ex.category}</p>
            <h4 class="text-sm font-bold">${ex.name}</h4>
          </div>
          <button onclick="toggleExercise('${ex.id}')" class="px-2.5 py-1 rounded-lg text-xs font-semibold ${isAdded ? 'bg-rose-500/10 text-rose-500' : 'bg-brand/10 text-brand'}">
            ${isAdded ? 'Kaldır' : '+ Ekle'}
          </button>
        `;
        libContainer.appendChild(card);
      });

      // Seçili Egzersizler Paneli
      const selectedContainer = document.getElementById('selected-routine-list');
      selectedContainer.innerHTML = '';
      routines[currentBuilderDay].forEach(id => {
        const ex = EXERCISES.find(e => e.id === id);
        if (!ex) return;
        const tag = document.createElement('div');
        tag.className = 'flex items-center justify-between bg-slate-100 dark:bg-slate-700/50 p-2.5 rounded-lg text-sm';
        tag.innerHTML = `
          <span class="font-medium">${ex.name}</span>
          <button onclick="toggleExercise('${ex.id}')" class="text-slate-400 hover:text-rose-500"><i class="fa-solid fa-xmark"></i></button>
        `;
        selectedContainer.appendChild(tag);
      });
    }

    function toggleExercise(id) {
      const idx = routines[currentBuilderDay].indexOf(id);
      if (idx > -1) {
        routines[currentBuilderDay].splice(idx, 1);
      } else {
        routines[currentBuilderDay].push(id);
      }
      saveRoutines();
      renderBuilder();
    }

    // --- KÜTÜPHANE GÖRÜNÜMÜ ---
    function filterCategory(cat) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.className = 'filter-btn px-3 py-1 rounded-full text-xs bg-slate-200 dark:bg-slate-800';
      });
      event.target.className = 'filter-btn active px-3 py-1 rounded-full text-xs font-semibold bg-brand text-white';
      renderLibrary(cat);
    }

    function renderLibrary(category = 'hepsi') {
      const grid = document.getElementById('full-library-grid');
      grid.innerHTML = '';
      const filtered = category === 'hepsi' ? EXERCISES : EXERCISES.filter(e => e.category === category);

      filtered.forEach(ex => {
        const card = document.createElement('div');
        card.className = 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden shadow-sm flex flex-col';
        card.innerHTML = `
          <img src="${ex.gif}" alt="${ex.name}" class="h-44 w-full object-cover" />
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <span class="text-xs uppercase font-bold text-brand">${ex.category}</span>
              <h3 class="font-bold text-lg mt-0.5">${ex.name}</h3>
              <p class="text-xs text-slate-400 mt-1">${ex.target}</p>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Başlatma
    initTheme();
    renderToday();
  </script>
</body>
</html>
