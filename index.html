<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeFit Koç - Evde Egzersiz ve Program Takibi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#6366f1'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* İki kareli döngüsel form animasyonu (GIF alternatifi) */
    @keyframes frameLoop {
      0%, 45% { opacity: 1; }
      50%, 95% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes frameLoopAlt {
      0%, 45% { opacity: 0; }
      50%, 95% { opacity: 1; }
      100% { opacity: 0; }
    }
    .anim-f1 { animation: frameLoop 1.8s infinite ease-in-out; }
    .anim-f2 { animation: frameLoopAlt 1.8s infinite ease-in-out; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">

  <!-- Üst Menü -->
  <header class="border-b border-slate-200 dark:border-slate-800 bg-white/90 dark:bg-slate-900/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-heart-pulse text-brand text-2xl"></i>
        <span class="font-bold text-lg tracking-tight">HomeFit Koç</span>
      </div>
      <div class="flex items-center gap-2 sm:gap-3">
        <nav class="flex gap-1 sm:gap-2">
          <button onclick="switchTab('today')" id="tab-today" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium bg-brand text-white">Bugün</button>
          <button onclick="switchTab('program')" id="tab-program" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-800">Program Yap</button>
          <button onclick="switchTab('library')" id="tab-library" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-800">Kütüphane</button>
        </nav>
        <button onclick="toggleTheme()" class="p-2 rounded-lg border border-slate-200 dark:border-slate-800 hover:bg-slate-200 dark:hover:bg-slate-800" title="Tema">
          <i id="theme-icon" class="fa-solid fa-sun text-amber-400"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 md:p-6">
    
    <!-- 1. SEKME: BUGÜNÜN LİSTESİ -->
    <section id="view-today" class="space-y-6">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h1 class="text-2xl font-bold">Bugünün Antrenmanı</h1>
          <p id="current-day-label" class="text-slate-500 dark:text-slate-400 text-sm capitalize"></p>
        </div>
        <div class="flex items-center gap-1 bg-white dark:bg-slate-800 p-1.5 rounded-xl border border-slate-200 dark:border-slate-700 overflow-x-auto max-w-full no-scrollbar">
          <button onclick="setPreviewDay(1)" class="day-btn px-2.5 py-1 rounded text-xs">Pzt</button>
          <button onclick="setPreviewDay(2)" class="day-btn px-2.5 py-1 rounded text-xs">Sal</button>
          <button onclick="setPreviewDay(3)" class="day-btn px-2.5 py-1 rounded text-xs">Çar</button>
          <button onclick="setPreviewDay(4)" class="day-btn px-2.5 py-1 rounded text-xs">Per</button>
          <button onclick="setPreviewDay(5)" class="day-btn px-2.5 py-1 rounded text-xs">Cum</button>
          <button onclick="setPreviewDay(6)" class="day-btn px-2.5 py-1 rounded text-xs">Cmt</button>
          <button onclick="setPreviewDay(0)" class="day-btn px-2.5 py-1 rounded text-xs">Paz</button>
        </div>
      </div>

      <div id="today-exercises" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- JS ile dolacak -->
      </div>
    </section>

    <!-- 2. SEKME: PROGRAM OLUŞTURUCU -->
    <section id="view-program" class="space-y-6 hidden">
      <div>
        <h1 class="text-2xl font-bold">Programını Özelleştir</h1>
        <p class="text-slate-500 dark:text-slate-400 text-sm">Günü seç, 80 ev egzersizinden dilediklerini ekle. Boş günler varsayılan şablondan çalışır.</p>
      </div>

      <div class="flex flex-wrap gap-2 border-b border-slate-200 dark:border-slate-800 pb-3">
        <button onclick="selectRoutineDay('all')" class="routine-tab px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-brand text-white">Her Gün Aynı</button>
        <button onclick="selectRoutineDay('1')" class="routine-tab px-3 py-1.5 rounded-lg text-xs sm:text-sm bg-slate-200 dark:bg-slate-800">Pazartesi</button>
        <button onclick="selectRoutineDay('2')" class="routine-tab px-3 py-1.5 rounded-lg text-xs sm:text-sm bg-slate-200 dark:bg-slate-800">Salı</button>
        <button onclick="selectRoutineDay('3')" class="routine-tab px-3 py-1.5 rounded-lg text-xs sm:text-sm bg-slate-200 dark:bg-slate-800">Çarşamba</button>
        <button onclick="selectRoutineDay('4')" class="routine-tab px-3 py-1.5 rounded-lg text-xs sm:text-sm bg-slate-200 dark:bg-slate-800">Perşembe</button>
        <button onclick="selectRoutineDay('5')" class="routine-tab px-3 py-1.5 rounded-lg text-xs sm:text-sm bg-slate-200 dark:bg-slate-800">Cuma</button>
        <button onclick="selectRoutineDay('6')" class="routine-tab px-3 py-1.5 rounded-lg text-xs sm:text-sm bg-slate-200 dark:bg-slate-800">Cumartesi</button>
        <button onclick="selectRoutineDay('0')" class="routine-tab px-3 py-1.5 rounded-lg text-xs sm:text-sm bg-slate-200 dark:bg-slate-800">Pazar</button>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 space-y-4">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
            <h2 class="font-semibold text-base sm:text-lg">Kütüphaneden Seç</h2>
            <div class="flex gap-1 overflow-x-auto max-w-full pb-1">
              <button onclick="filterBuilderCategory('all')" class="b-cat-btn px-2.5 py-0.5 rounded text-xs bg-brand text-white font-medium">Tümü</button>
              <button onclick="filterBuilderCategory('kalça')" class="b-cat-btn px-2.5 py-0.5 rounded text-xs bg-slate-200 dark:bg-slate-800">Kalça</button>
              <button onclick="filterBuilderCategory('bacak')" class="b-cat-btn px-2.5 py-0.5 rounded text-xs bg-slate-200 dark:bg-slate-800">Bacak</button>
              <button onclick="filterBuilderCategory('kol')" class="b-cat-btn px-2.5 py-0.5 rounded text-xs bg-slate-200 dark:bg-slate-800">Kol</button>
              <button onclick="filterBuilderCategory('sırt')" class="b-cat-btn px-2.5 py-0.5 rounded text-xs bg-slate-200 dark:bg-slate-800">Sırt</button>
            </div>
          </div>
          <div id="builder-library-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[580px] overflow-y-auto pr-1">
            <!-- JS ile hareketler dolacak -->
          </div>
        </div>

        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 h-fit space-y-4 shadow-sm">
          <div class="flex items-center justify-between">
            <h2 class="font-semibold text-base">Programa Eklenenler</h2>
            <span id="selected-count" class="text-xs text-brand font-semibold">0 hareket</span>
          </div>
          <div id="selected-routine-list" class="space-y-2 min-h-[140px] max-h-[480px] overflow-y-auto pr-1">
            <!-- Seçili liste -->
          </div>
        </div>
      </div>
    </section>

    <!-- 3. SEKME: DETAYLI KÜTÜPHANE VE FORM ŞABLONLARI -->
    <section id="view-library" class="space-y-6 hidden">
      <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4">
        <div>
          <h1 class="text-2xl font-bold">Kapsamlı Ev Kütüphanesi</h1>
          <p class="text-slate-500 dark:text-slate-400 text-sm">80 egzersiz: 2 aşamalı döngüsel form gösterimleri, adımlar ve püf noktaları.</p>
        </div>
        <div class="flex flex-wrap gap-1.5" id="filter-buttons">
          <button onclick="filterLibraryCategory('hepsi')" class="filter-btn px-3 py-1 rounded-full text-xs font-semibold bg-brand text-white">Tümü (80)</button>
          <button onclick="filterLibraryCategory('kalça')" class="filter-btn px-3 py-1 rounded-full text-xs bg-slate-200 dark:bg-slate-800">Kalça (20)</button>
          <button onclick="filterLibraryCategory('bacak')" class="filter-btn px-3 py-1 rounded-full text-xs bg-slate-200 dark:bg-slate-800">Bacak (20)</button>
          <button onclick="filterLibraryCategory('kol')" class="filter-btn px-3 py-1 rounded-full text-xs bg-slate-200 dark:bg-slate-800">Kol (20)</button>
          <button onclick="filterLibraryCategory('sırt')" class="filter-btn px-3 py-1 rounded-full text-xs bg-slate-200 dark:bg-slate-800">Sırt (20)</button>
        </div>
      </div>

      <div id="full-library-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- JS ile dolacak -->
      </div>
    </section>

  </main>

  <script>
    // FORM ŞABLONU İÇİN İKİ AŞAMALI ANİMASYONLU VEKTÖRLER
    function getExerciseAnimationSvg(type, isSmall = false) {
      const h = isSmall ? 'h-14 w-14' : 'h-48 w-full';
      const strokeW = isSmall ? '5' : '4';
      const headR = isSmall ? '7' : '9';
      
      let f1 = '', f2 = '';

      if (type === 'bridge') {
        // Pozisyon 1: Yerde yatış | Pozisyon 2: Kalça tepeye kalkmış
        f1 = `<path d="M 20 85 L 45 85 L 60 70 L 80 85" fill="none" stroke="#6366f1" stroke-width="${strokeW}" stroke-linecap="round"/>
              <circle cx="18" cy="80" r="${headR}" fill="#818cf8"/>`;
        f2 = `<path d="M 20 85 L 50 60 L 68 60 L 80 85" fill="none" stroke="#22c55e" stroke-width="${strokeW}" stroke-linecap="round"/>
              <circle cx="18" cy="80" r="${headR}" fill="#4ade80"/>`;
      } else if (type === 'quadruped') {
        // Dört ayak: Başlangıç | Bacak havada
        f1 = `<path d="M 25 50 L 45 50 L 45 85 M 25 50 L 25 85 M 45 50 L 70 85" fill="none" stroke="#6366f1" stroke-width="${strokeW}" stroke-linecap="round"/>
              <circle cx="16" cy="45" r="${headR}" fill="#818cf8"/>`;
        f2 = `<path d="M 25 50 L 45 50 L 45 85 M 25 50 L 25 85 M 45 50 L 80 45" fill="none" stroke="#22c55e" stroke-width="${strokeW}" stroke-linecap="round"/>
              <circle cx="16" cy="45" r="${headR}" fill="#4ade80"/>`;
      } else if (type === 'squat') {
        // Ayakta dik | Derin squat
        f1 = `<path d="M 50 35 L 50 65 L 40 95 M 50 65 L 60 95 M 50 45 L 35 55 M 50 45 L 65 55" fill="none" stroke="#6366f1" stroke-width="${strokeW}" stroke-linecap="round"/>
              <circle cx="50" cy="22" r="${headR}" fill="#818cf8"/>`;
        f2 = `<path d="M 40 55 L 40 70 L 60 70 L 55 95 M 40 70 L 30 95 M 40 60 L 65 60" fill="none" stroke="#22c55e" stroke-width="${strokeW}" stroke-linecap="round"/>
              <circle cx="38" cy="42" r="${headR}" fill="#4ade80"/>`;
      } else if (type === 'lunge') {
        // Ayakta | Lunge çöküşü
        f1 = `<path d="M 50 35 L 50 65 L 45 95 M 50 65 L 55 95" fill="none" stroke="#6366f1" stroke-width="${strokeW}" stroke-linecap="round"/>
              <circle cx="50" cy="22" r="${headR}" fill="#818cf8"/>`;
        f2 = `<path d="M 45 50 L 45 70 L 65 70 L 65 95 M 45 70 L 30 75 L 28 95" fill="none" stroke="#22c55e" stroke-width="${strokeW}" stroke-linecap="round"/>
              <circle cx="45" cy="35" r="${headR}" fill="#4ade80"/>`;
      } else if (type === 'curl') {
        // Kol aşağıda | Kol bükülü yukarıda
        f1 = `<path d="M 50 35 L 50 70 L 40 95 M 50 70 L 60 95 M 50 45 L 65 65 L 65 85" fill="none" stroke="#6366f1" stroke-width="${strokeW}" stroke-linecap="round"/>
              <circle cx="50" cy="22" r="${headR}" fill="#818cf8"/>`;
        f2 = `<path d="M 50 35 L 50 70 L 40 95 M 50 70 L 60 95 M 50 45 L 65 65 L 60 48" fill="none" stroke="#22c55e" stroke-width="${strokeW}" stroke-linecap="round"/>
              <circle cx="50" cy="22" r="${headR}" fill="#4ade80"/>`;
      } else if (type === 'dips') {
        // Dips yukarıda | Dips aşağıda
        f1 = `<path d="M 65 45 L 65 90 M 45 55 L 45 75 L 35 90 M 45 58 L 65 58 L 65 70" fill="none" stroke="#6366f1" stroke-width="${strokeW}" stroke-linecap="round"/>
              <circle cx="45" cy="42" r="${headR}" fill="#818cf8"/>`;
        f2 = `<path d="M 65 45 L 65 90 M 45 68 L 45 82 L 35 90 M 45 68 L 55 60 L 65 70" fill="none" stroke="#22c55e" stroke-width="${strokeW}" stroke-linecap="round"/>
              <circle cx="45" cy="54" r="${headR}" fill="#4ade80"/>`;
      } else if (type === 'superman') {
        // Yerde düz | Kollar & bacaklar havada
        f1 = `<path d="M 15 85 L 85 85" fill="none" stroke="#6366f1" stroke-width="${strokeW}" stroke-linecap="round"/>
              <circle cx="20" cy="80" r="${headR}" fill="#818cf8"/>`;
        f2 = `<path d="M 15 70 L 35 85 L 65 85 L 85 70" fill="none" stroke="#22c55e" stroke-width="${strokeW}" stroke-linecap="round"/>
              <circle cx="15" cy="62" r="${headR}" fill="#4ade80"/>`;
      } else {
        // Genel / Row
        f1 = `<path d="M 45 40 L 45 75 L 35 95 M 45 75 L 55 95 M 45 50 L 70 65" fill="none" stroke="#6366f1" stroke-width="${strokeW}" stroke-linecap="round"/>
              <circle cx="45" cy="26" r="${headR}" fill="#818cf8"/>`;
        f2 = `<path d="M 45 40 L 45 75 L 35 95 M 45 75 L 55 95 M 45 50 L 60 52 L 40 50" fill="none" stroke="#22c55e" stroke-width="${strokeW}" stroke-linecap="round"/>
              <circle cx="45" cy="26" r="${headR}" fill="#4ade80"/>`;
      }

      return `
        <div class="relative ${h} bg-slate-950 rounded-xl overflow-hidden flex items-center justify-center p-2">
          <svg viewBox="0 0 100 100" class="absolute w-full h-full anim-f1">${f1}</svg>
          <svg viewBox="0 0 100 100" class="absolute w-full h-full anim-f2">${f2}</svg>
          <span class="absolute bottom-1 right-1.5 text-[9px] text-slate-500 font-mono tracking-tighter opacity-70">1⟳2</span>
        </div>
      `;
    }

    // 80 ADET DETAYLI EV EGZERSİZİ LİSTESİ
    const EXERCISES = [
      // ==================== KALÇA (20 HAREKET) ====================
      { id: 'kl_01', name: 'Glute Bridge (Klasik Köprü)', category: 'kalça', target: 'Büyük Kalça (Maximus)', equipment: 'Mat', animType: 'bridge', steps: ['Sırtüstü uzanıp dizleri bükün.', 'Topuklardan güç alarak kalçayı yukarı itin.', 'Tepe noktada kalçayı 2 saniye sıkıp bırakın.'], tip: 'Beli bükmeyin, yükü kalçaya verin.' },
      { id: 'kl_02', name: 'Tek Bacak Glute Bridge', category: 'kalça', target: 'Kalça İzolasyonu', equipment: 'Mat', animType: 'bridge', steps: ['Bir bacağı tavana dik uzatın.', 'Yerdeki tek topukla kalçayı kaldırın.', 'Pelvisi dengede tutun.'], tip: 'İki taraf için de eşit tekrar yapın.' },
      { id: 'kl_03', name: 'Donkey Kicks (Eşek Tekmesi)', category: 'kalça', target: 'Üst Kalça Şekillendirme', equipment: 'Mat', animType: 'quadruped', steps: ['Dört ayak üstünde durun.', 'Diz 90 dereceyken tabanınızı tavana itin.', 'Kalçayı sıkıp indirin.'], tip: 'Beli çukurlaştırmayın.' },
      { id: 'kl_04', name: 'Fire Hydrant (Yana Açış)', category: 'kalça', target: 'Yan Kalça (Medius)', equipment: 'Mat', animType: 'quadruped', steps: ['Dört ayak pozisyonu alın.', 'Dizin açısını bozmadan bacağı yana açın.', 'Kontrollü indirin.'], tip: 'Gövdeyi yana devirmeyin.' },
      { id: 'kl_05', name: 'Frog Pump (Kurbağa Köprüsü)', category: 'kalça', target: 'Derin Kalça Aktivasyonu', equipment: 'Mat', animType: 'bridge', steps: ['Ayak tabanlarınızı birbirine yapıştırın.', 'Tabanları bastırarak kalçayı kaldırın.', 'Zirvede kalçayı sıkın.'], tip: 'Dizleri iki yana açık tutun.' },
      { id: 'kl_06', name: 'Clamshell (Deniz Kabuğu)', category: 'kalça', target: 'Dış Kalça & Stabilite', equipment: 'Mat', animType: 'quadruped', steps: ['Yan uzanıp dizleri 45 derece bükün.', 'Topukları temas ettirip üstteki dizi açın.', 'Geri indirin.'], tip: 'Pelvisi geriye devirmeyin.' },
      { id: 'kl_07', name: 'Koltukta Hip Thrust', category: 'kalça', target: 'Maksimum Kalça Yükü', equipment: 'Koltuk / Sandalye', animType: 'dips', steps: ['Kürek kemiklerini koltuğa yaslayın.', 'Kalçayı indirip yukarı itin.', 'Tepe noktada kilitlenin.'], tip: 'Gözler karşıya baksın.' },
      { id: 'kl_08', name: 'Ayakta Geriye Tekme', category: 'kalça', target: 'Gluteus Maximus', equipment: 'Sandalye Desteği', animType: 'quadruped', steps: ['Sandalyeye tutunup hafif öne eğilin.', 'Bacağınızı arkaya düz uzatıp sıkın.', 'Yavaşça bırakın.'], tip: 'Belden değil kalçadan uzanın.' },
      { id: 'kl_09', name: 'Yana Yatarak Düz Bacak Kaldırma', category: 'kalça', target: 'Yan Kalça', equipment: 'Mat', animType: 'quadruped', steps: ['Yan uzanın.', 'Üstteki bacağı düz şekilde yukarı kaldırın.', 'Yavaşça indirin.'], tip: 'Ayak ucu hafifçe yere baksın.' },
      { id: 'kl_10', name: 'Curtsy Lunge (Kraliyet Adımı)', category: 'kalça', target: 'Kalça Çevresi & Basen', equipment: 'Vücut Ağırlığı', animType: 'lunge', steps: ['Bir bacağı çapraz arkaya atarak çökün.', 'Öndeki topuktan iterek kalkın.', 'Taraf değiştirin.'], tip: 'Öndeki dizin içe dönmesini engelleyin.' },
      { id: 'kl_11', name: 'Sumo Squat Pulse', category: 'kalça', target: 'İç Bacak ve Alt Kalça', equipment: 'Vücut Ağırlığı', animType: 'squat', steps: ['Ayakları genişçe açıp çökün.', 'En dipte 5 cm yaylanın.', 'Tam ayağa kalkmadan devam edin.'], tip: 'Dizleri sürekli dışa itin.' },
      { id: 'kl_12', name: 'Köprüde Diz Açma-Kapama', category: 'kalça', target: 'Kalça Dışı & Sabitleyiciler', equipment: 'Mat', animType: 'bridge', steps: ['Köprü pozisyonunda havada kalın.', 'Kalçayı düşürmeden dizleri açıp kapatın.', '30 saniye sürdürün.'], tip: 'Topukların dış kenarlarına basın.' },
      { id: 'kl_13', name: 'Ayakta Yana Bacak Açma', category: 'kalça', target: 'Yan Kalça Sıkılaşması', equipment: 'Sandalye Desteği', animType: 'quadruped', steps: ['Dik durun, sandalyeye tutunun.', 'Bir bacağı yana doğru açın.', 'Gövdeyi dik tutun.'], tip: 'Hareketi savurmadan yapın.' },
      { id: 'kl_14', name: 'Yüzüstü Bacak Sıkıştırma', category: 'kalça', target: 'Arka Kalça & Bel', equipment: 'Mat', animType: 'superman', steps: ['Yüzüstü yatın.', 'Bacakları kalçayı sıkarak 15 cm kaldırın.', '1 saniye bekletip indirin.'], tip: 'Dizleri bükmemeye çalışın.' },
      { id: 'kl_15', name: 'Bulgarian Split Squat', category: 'kalça', target: 'Tek Taraflı Kalça', equipment: 'Sandalye / Koltuk', animType: 'lunge', steps: ['Arka ayağı sandalyeye koyun.', 'Gövdeyi hafif öne yatırıp derin çökün.', 'Öndeki topukla kalkın.'], tip: 'Gövdeyi öne yatırmak kalçayı odaklar.' },
      { id: 'kl_16', name: 'Rainbows (Gökkuşağı)', category: 'kalça', target: 'Tüm Kalça Çevresi', equipment: 'Mat', animType: 'quadruped', steps: ['Dört ayak üstünde bacağı arkaya uzatın.', 'Sağdan sola havada yay çizin.', 'Uç noktalarda yere dokunun.'], tip: 'Beli kıpırdatmayın.' },

    const DAYS = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];

    let routines = JSON.parse(localStorage.getItem('homefit_routines_v4')) || {
      'all': ['kl_01', 'kl_03', 'bc_01', 'kl_b01', 'sr_01'],
      '1': [], '2': [], '3': [], '4': [], '5': [], '6': [], '0': []
    };
    let activeDay = new Date().getDay();
    let currentBuilderDay = 'all';
    let currentBuilderFilter = 'all';

    function saveRoutines() {
      localStorage.setItem('homefit_routines_v4', JSON.stringify(routines));
    }

    // TEMA
    function initTheme() {
      if (localStorage.theme === 'light') {
        document.documentElement.classList.remove('dark');
        document.getElementById('theme-icon').className = 'fa-solid fa-moon text-slate-600';
      } else {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon').className = 'fa-solid fa-sun text-amber-400';
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.theme = isDark ? 'dark' : 'light';
      document.getElementById('theme-icon').className = isDark 
        ? 'fa-solid fa-sun text-amber-400' 
        : 'fa-solid fa-moon text-slate-600';
    }

    // SEKME GEÇİŞLERİ
    function switchTab(tab) {
      ['today', 'program', 'library'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-800';
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium bg-brand text-white';

      if(tab === 'today') renderToday();
      if(tab === 'program') renderBuilder();
      if(tab === 'library') renderLibrary('hepsi');
    }

    function setPreviewDay(day) {
      activeDay = day;
      renderToday();
    }

    // BUGÜNÜN LİSTESİ
    function renderToday() {
      const label = document.getElementById('current-day-label');
      label.textContent = `${DAYS[activeDay]} Ev Antrenmanı`;

      document.querySelectorAll('.day-btn').forEach((btn, idx) => {
        const d = [1,2,3,4,5,6,0][idx];
        if (d === activeDay) {
          btn.className = 'day-btn px-2.5 py-1 rounded text-xs bg-brand text-white font-bold';
        } else {
          btn.className = 'day-btn px-2.5 py-1 rounded text-xs hover:bg-slate-200 dark:hover:bg-slate-700';
        }
      });

      const list = (routines[activeDay] && routines[activeDay].length > 0) ? routines[activeDay] : routines['all'];
      const container = document.getElementById('today-exercises');
      container.innerHTML = '';

      if (!list || list.length === 0) {
        container.innerHTML = `<div class="col-span-2 text-center py-12 text-slate-400">Bu gün için hareket seçilmedi. "Program Yap" sekmesinden 80 hareketten dilediğini ekleyebilirsin.</div>`;
        return;
      }

      list.forEach(exId => {
        const ex = EXERCISES.find(e => e.id === exId);
        if (!ex) return;
        const card = document.createElement('div');
        card.className = 'bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row gap-4 items-center shadow-sm';
        card.innerHTML = `
          <div class="w-full sm:w-28 shrink-0">
            ${getExerciseAnimationSvg(ex.animType, false)}
          </div>
          <div class="flex-1 text-center sm:text-left">
            <span class="text-[11px] uppercase font-bold text-brand tracking-wider">${ex.category} • ${ex.equipment}</span>
            <h3 class="font-bold text-base mt-0.5">${ex.name}</h3>
            <p class="text-xs text-slate-400 mt-0.5">${ex.target}</p>
            <p class="text-[11px] text-amber-500 dark:text-amber-400 mt-1.5"><i class="fa-solid fa-lightbulb mr-1"></i>${ex.tip}</p>
          </div>
          <button onclick="this.classList.toggle('bg-emerald-500'); this.classList.toggle('text-white');" class="w-10 h-10 rounded-full border border-slate-300 dark:border-slate-600 flex items-center justify-center transition shrink-0">
            <i class="fa-solid fa-check"></i>
          </button>
        `;
        container.appendChild(card);
      });
    }

    // PROGRAM OLUŞTURUCU
    function selectRoutineDay(day) {
      currentBuilderDay = day;
      document.querySelectorAll('.routine-tab').forEach(btn => {
        btn.className = 'routine-tab px-3 py-1.5 rounded-lg text-xs sm:text-sm bg-slate-200 dark:bg-slate-800';
      });
      event.target.className = 'routine-tab px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-brand text-white';
      renderBuilder();
    }

    function filterBuilderCategory(cat) {
      currentBuilderFilter = cat;
      document.querySelectorAll('.b-cat-btn').forEach(b => {
        b.className = 'b-cat-btn px-2.5 py-0.5 rounded text-xs bg-slate-200 dark:bg-slate-800';
      });
      event.target.className = 'b-cat-btn px-2.5 py-0.5 rounded text-xs bg-brand text-white font-medium';
      renderBuilder();
    }

    function renderBuilder() {
      const libContainer = document.getElementById('builder-library-list');
      libContainer.innerHTML = '';
      
      const filtered = currentBuilderFilter === 'all' 
        ? EXERCISES 
        : EXERCISES.filter(e => e.category === currentBuilderFilter);

      filtered.forEach(ex => {
        const isAdded = routines[currentBuilderDay].includes(ex.id);
        const card = document.createElement('div');
        card.className = 'p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/60 flex items-center justify-between gap-2';
        card.innerHTML = `
          <div class="flex items-center gap-2.5">
            ${getExerciseAnimationSvg(ex.animType, true)}
            <div>
              <p class="text-[10px] text-brand font-semibold uppercase">${ex.category}</p>
              <h4 class="text-xs sm:text-sm font-bold leading-snug line-clamp-1">${ex.name}</h4>
            </div>
          </div>
          <button onclick="toggleExercise('${ex.id}')" class="px-2.5 py-1 rounded-lg text-xs font-semibold shrink-0 transition ${isAdded ? 'bg-rose-500/10 text-rose-500 border border-rose-500/20' : 'bg-brand text-white'}">
            ${isAdded ? 'Kaldır' : '+ Ekle'}
          </button>
        `;
        libContainer.appendChild(card);
      });

      const selectedContainer = document.getElementById('selected-routine-list');
      selectedContainer.innerHTML = '';
      const curList = routines[currentBuilderDay] || [];
      document.getElementById('selected-count').textContent = `${curList.length} hareket`;

      if (curList.length === 0) {
        selectedContainer.innerHTML = '<p class="text-xs text-slate-400 py-6 text-center">Bu güne henüz hareket eklenmedi.</p>';
      }

      curList.forEach(id => {
        const ex = EXERCISES.find(e => e.id === id);
        if (!ex) return;
        const tag = document.createElement('div');
        tag.className = 'flex items-center justify-between bg-slate-100 dark:bg-slate-700/50 p-2.5 rounded-xl text-xs sm:text-sm';
        tag.innerHTML = `
          <span class="font-medium line-clamp-1">${ex.name}</span>
          <button onclick="toggleExercise('${ex.id}')" class="text-slate-400 hover:text-rose-500 p-1"><i class="fa-solid fa-xmark"></i></button>
        `;
        selectedContainer.appendChild(tag);
      });
    }

    function toggleExercise(id) {
      const idx = routines[currentBuilderDay].indexOf(id);
      if (idx > -1) {
        routines[currentBuilderDay].splice(idx, 1);
      } else {
        routines[currentBuilderDay].push(id);
      }
      saveRoutines();
      renderBuilder();
    }

    // KÜTÜPHANE GÖRÜNÜMÜ & ŞABLONLAR
    function filterLibraryCategory(cat) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.className = 'filter-btn px-3 py-1 rounded-full text-xs bg-slate-200 dark:bg-slate-800';
      });
      event.target.className = 'filter-btn active px-3 py-1 rounded-full text-xs font-semibold bg-brand text-white';
      renderLibrary(cat);
    }

    function renderLibrary(category = 'hepsi') {
      const grid = document.getElementById('full-library-grid');
      grid.innerHTML = '';
      const filtered = category === 'hepsi' ? EXERCISES : EXERCISES.filter(e => e.category === category);

      filtered.forEach(ex => {
        const card = document.createElement('div');
        card.className = 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden shadow-sm flex flex-col';
        
        const stepsHtml = ex.steps.map((s, idx) => `<li class="text-xs text-slate-500 dark:text-slate-400 mb-1"><strong class="text-slate-700 dark:text-slate-200">${idx+1}.</strong> ${s}</li>`).join('');

        card.innerHTML = `
          <div class="relative bg-slate-950 flex items-center justify-center p-4">
            ${getExerciseAnimationSvg(ex.animType, false)}
            <span class="absolute top-3 left-3 bg-brand text-white text-[10px] font-bold uppercase px-2 py-0.5 rounded-md shadow">${ex.category}</span>
          </div>
          <div class="p-4 sm:p-5 flex-1 flex flex-col justify-between space-y-3">
            <div>
              <h3 class="font-bold text-base sm:text-lg">${ex.name}</h3>
              <p class="text-xs text-slate-400 font-medium mt-0.5"><i class="fa-solid fa-bullseye mr-1 text-brand"></i>${ex.target}</p>
              <p class="text-xs text-slate-400 font-medium mt-0.5"><i class="fa-solid fa-house mr-1 text-brand"></i>${ex.equipment}</p>
              
              <div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-700">
                <span class="text-xs font-semibold block mb-1.5">Nasıl Yapılır? (Form Rehberi)</span>
                <ul class="list-none pl-0">
                  ${stepsHtml}
                </ul>
              </div>
            </div>

            <div class="bg-amber-50 dark:bg-amber-950/30 border border-amber-200/50 dark:border-amber-800/40 p-2.5 rounded-xl">
              <p class="text-[11px] text-amber-700 dark:text-amber-300 leading-relaxed">
                <strong>Püf Noktası:</strong> ${ex.tip}
              </p>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    initTheme();
    renderToday();
  </script>
</body>
</html>
